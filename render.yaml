services:
  - type: web
    name: arena-epv-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema backend/prisma/schema.prisma && npx prisma db push --schema backend/prisma/schema.prisma && npm --workspace backend run seed && npm --workspace backend run build
    startCommand: npm --workspace backend run start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PAYMENTS_MODE
        value: mock
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
